name: Scanner
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  scanner:
    name: Scan Repo
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: trivy_repo_scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "table"
          # format: "sarif"
          # output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          github-pat: ${{ github.token }}
